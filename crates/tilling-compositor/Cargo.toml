[package]
name = "tilling-compositor"
description = "Wayland compositor runtime of Tilling built on Smithay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["drm", "nested"]
drm = [
    "smithay/backend_drm",
    "smithay/backend_egl",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "smithay/renderer_gl",
    "smithay/renderer_multi",
]
nested = ["smithay/backend_winit", "smithay/renderer_gl"]

[dependencies]
calloop = { workspace = true }
rustix = { workspace = true }
signal-hook = { workspace = true }
smithay = { workspace = true, features = ["desktop", "renderer_test", "wayland_frontend"] }
thiserror = { workspace = true }
tilling-config = { workspace = true }
tilling-core = { workspace = true }
tilling-ipc = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tilling-test-support = { workspace = true }

[lints]
workspace = true
