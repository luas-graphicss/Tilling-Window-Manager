[workspace]
resolver = "3"
members = ["crates/tilling-config", "crates/tilling-core", "crates/tilling-ipc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/luas-graphicss/Tilling-Window-Manager"
publish = false

[workspace.dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tilling-core = { path = "crates/tilling-core" }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
